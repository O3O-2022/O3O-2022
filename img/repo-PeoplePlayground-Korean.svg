<svg xmlns="http://www.w3.org/2000/svg" width="440" height="132" viewBox="0 0 440 132" role="img" aria-label="PeoplePlayground-Korean 저장소" font-family="'Motiva Sans','Segoe UI','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif">

  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2c3c"/>
      <stop offset="1" stop-color="#16202d"/>
    </linearGradient>
  </defs>
  <rect width="440" height="132" rx="4" fill="url(#rbg)"/>
  <rect x="0.5" y="0.5" width="439" height="131" rx="4" fill="none" stroke="#2a3f55"/>
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2a12"/><stop offset="1" stop-color="#d49a3a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="capc"><rect x="14" y="14" width="150" height="104" rx="2"/></clipPath>
  </defs>
  <rect x="14" y="14" width="150" height="104" rx="2" fill="url(#cap)"/>
  <text x="89" y="78" text-anchor="middle" font-size="34" font-weight="bold" fill="#fff" fill-opacity="0.9">PK</text>
  <rect x="-60" y="14" width="50" height="104" fill="url(#shine)" clip-path="url(#capc)" transform="skewX(-15)">
    <animate attributeName="x" values="-60;260" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="180" y="40" font-size="16" fill="#fff">PeoplePlayground-Korean</text>
  <text x="180" y="64" font-size="12.5" fill="#c7d5e0">People Playground 비공식 한국어 패치</text>
  <text x="180" y="92" font-size="12.5" fill="#66c0f4">C# · ★ 0</text>
  <text x="180" y="112" font-size="12" fill="#8f98a0">최근 업데이트 2026.10.31</text>

</svg>

name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#66c0f4&color_dots=#e6ebf0,#b9d9ef,#7fb9e0,#3f8fc6,#1a5c8a
            dist/snake-dark.svg?color_snake=#66c0f4&color_dots=#1b2838,#1e3a52,#2a6496,#4a9fd8,#66c0f4
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
